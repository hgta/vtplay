# 推送 v* 标签即自动发布：构建 → 打包便携版 → 创建 Release 并上传 zip。
#
# 为什么放在 Actions 里而不是本地跑命令：创建 Release 与上传资产都需要
# 写权限的凭据。Actions 由 GitHub 自己提供 GITHUB_TOKEN（见下方 permissions），
# 因此发布不需要任何人持有 PAT，也不用手工上传压缩包。
#
# 发布流程：
#   1. 改 CMakeLists.txt 里的版本号并提交
#   2. 在 CHANGELOG.md 顶部补上该版本的段落（会被抽出来当 Release 说明）
#   3. git tag -a v0.2.1 -m "..." && git push origin v0.2.1
#   CI 会校验「tag 与 CMakeLists 版本一致」，不一致直接失败——避免发布出
#   名为 0.2.1 实际是 0.2.0 的包。

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.2.0）'
        required: true

permissions:
  contents: write        # 创建 Release + 上传资产所必需

jobs:
  windows-portable:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验版本号一致
        shell: pwsh
        env:
          # tag 触发时用 ref_name；手工触发时用输入值
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # 单行写完整正则匹配，不用反引号续行——续行后的尾随空格在 YAML 块里
          # 很容易被忽略却让 PowerShell 语法失败
          $pat = 'project\(\s*\w+\s+VERSION\s+([0-9.]+)'
          $declared = (Select-String -Path CMakeLists.txt -Pattern $pat).Matches[0].Groups[1].Value
          $tag = $env:RELEASE_TAG -replace '^v', ''
          Write-Output "CMakeLists: $declared   tag: $env:RELEASE_TAG"
          if ($declared -ne $tag) {
            Write-Output "!!! 版本不一致：CMakeLists 是 $declared，tag 是 $tag"
            exit 1
          }
          "VTPLAY_VERSION=$declared" >> $env:GITHUB_ENV
          "RELEASE_TAG=$env:RELEASE_TAG" >> $env:GITHUB_ENV

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-multimedia-ffmpeg
            mingw-w64-x86_64-ffmpeg

      # 依赖里装 binutils 是给打包脚本用的：它靠 objdump 解析导入表来算依赖闭包
      - name: 构建
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      # 不要硬编码 MSYS2 路径，也不要从 `Get-Command bash` 反推——runner 上 PATH 里
      # 先命中的是 Git 自带的 bash（C:\Program Files\Git\bin\bash.exe），据此算出来的
      # 根目录是 C:\Program Files\Git，当然找不到 windeployqt。
      # 就在 MSYS2 shell 里用 cygpath 问它自己，结果写文件、再由 pwsh 读。
      - name: 定位 MSYS2 + 环境诊断
        run: |
          {
            echo "MSYSTEM=$MSYSTEM"
            echo "--- which ---"
            which windeployqt.exe 2>&1 || echo "(windeployqt 不在 PATH)"
            which objdump.exe 2>&1 || echo "(objdump 不在 PATH)"
            which ffmpeg.exe 2>&1 || echo "(ffmpeg 不在 PATH)"
            echo "--- 包是否装上 ---"
            pacman -Q mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-declarative \
                       mingw-w64-x86_64-ffmpeg mingw-w64-x86_64-binutils 2>&1
            echo "--- /mingw64/bin/windeployqt* ---"
            ls -l /mingw64/bin/windeployqt* 2>&1
            echo "--- cygpath /mingw64/bin ---"
            cygpath -w /mingw64/bin 2>&1
            echo "--- cygpath /mingw64 ---"
            cygpath -w /mingw64 2>&1
          } > ci-diag.txt 2>&1
          cat ci-diag.txt
          cygpath -w /mingw64/bin > mingw_bin.txt
          echo "MINGW_BIN = $(cat mingw_bin.txt)"

      - name: 读取 MSYS2 路径
        shell: pwsh
        run: |
          $p = (Get-Content mingw_bin.txt -Raw).Trim()
          Write-Output "MINGW_BIN=$p"
          if (-not (Test-Path (Join-Path $p 'windeployqt.exe'))) {
            Write-Output '!!! 该目录下没有 windeployqt.exe'
            Write-Output '--- ci-diag.txt ---'
            if (Test-Path ci-diag.txt) { Get-Content ci-diag.txt | ForEach-Object { Write-Output $_ } }
            exit 1
          }
          "MINGW_BIN=$p" >> $env:GITHUB_ENV

      - name: 打包便携版
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          # 输出同时写进 dist\package.log：失败时由后面的诊断步骤推到分支，
          # 便于在拿不到 Actions 日志的环境里排查（下载日志需要鉴权）
          & pwsh -NoProfile -File tools/release/make_release.ps1 -QtBin $env:MINGW_BIN `
              *>&1 | Tee-Object -FilePath dist\package.log
          $code = $LASTEXITCODE
          if ($code -ne 0) { Write-Output "make_release 失败，退出码 $code"; exit 1 }

      # 这一条是必须过的：依赖闭包不全时，程序会在 main() 之前加载失败，
      # 连日志都不产生（本地打包时实际踩过，缺了 66 个 DLL）。这里把它变成门禁。
      - name: 校验依赖闭包完整
        shell: pwsh
        run: |
          $dir = "dist/vtplay-$env:VTPLAY_VERSION-win64"
          if (-not (Test-Path $dir)) { Write-Output "missing $dir"; exit 1 }
          $objdump = Join-Path $env:MINGW_BIN 'objdump.exe'
          $sys = Join-Path $env:WINDIR 'System32'
          $missing = @{}
          foreach ($b in (Get-ChildItem $dir -Recurse -Include '*.exe','*.dll' -File)) {
            foreach ($line in (& $objdump -p $b.FullName 2>$null)) {
              if ($line -notmatch 'DLL Name:\s*(\S+)') { continue }
              $imp = $Matches[1].Trim()
              # api-ms-win-* 是 Windows 的 API set 虚拟 DLL，不是磁盘文件，跳过
              if ($imp -like 'api-ms-win-*') { continue }
              if (Test-Path (Join-Path $dir $imp)) { continue }
              if (Test-Path (Join-Path $sys $imp)) { continue }
              $missing[$imp] = $b.Name
            }
          }
          if ($missing.Count -gt 0) {
            Write-Output "!!! 缺失依赖 $($missing.Count) 个："
            foreach ($k in ($missing.Keys | Sort-Object)) { Write-Output "    $k  (needed by $($missing[$k]))" }
            exit 1
          }
          Write-Output '依赖闭包完整'

      - name: 关键文件在位
        shell: pwsh
        run: |
          $dir = "dist/vtplay-$env:VTPLAY_VERSION-win64"
          # qt.conf 是 QML 模块能被找到的前提；缺它换台机器就报
          # module "QtQuick.Controls.Basic" is not installed
          foreach ($f in @('vtplay.exe','qt.conf','ffmpeg.exe',
                           'platforms\qwindows.dll','qml\QtQuick\Controls')) {
            if (-not (Test-Path (Join-Path $dir $f))) { Write-Output "!!! missing $f"; exit 1 }
          }
          Write-Output '关键文件齐全'

      # 冒烟测试：offscreen 平台下启动，只要求写出启动日志。
      # continue-on-error —— 运行器上没有真实音频设备，播放起不来属环境限制，
      # 不应因此阻断发布（完整的播放验证在本地做，见 tools/release/verify_package.ps1）。
      - name: 冒烟测试（无界面启动）
        shell: pwsh
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $dir = "dist/vtplay-$env:VTPLAY_VERSION-win64"
          $log = Join-Path $env:LOCALAPPDATA 'VTPlay\VTPlay\vtplay.log'
          if (Test-Path $log) { Remove-Item $log -Force }
          $p = Start-Process -FilePath (Join-Path $dir 'vtplay.exe') -PassThru `
                -WorkingDirectory $dir -RedirectStandardError (Join-Path $env:TEMP 'smoke.err')
          Start-Sleep -Seconds 15
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (Test-Path $log) {
            Get-Content $log -Encoding UTF8 | Select-Object -First 12 | ForEach-Object { Write-Output $_ }
            if (@(Get-Content $log -Encoding UTF8 | Select-String '\[settings\] transcoder path=').Count -gt 0) {
              Write-Output 'SMOKE OK'
            } else { Write-Output 'SMOKE: 无启动行' }
          } else { Write-Output 'SMOKE: 没有产生日志' }

      # Release 说明直接取自 CHANGELOG.md 里该版本的段落——保持单一来源，
      # 免得「CHANGELOG 写了但 Release 说明是另一份」。
      - name: 抽取 Release 说明
        shell: pwsh
        run: |
          $md = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $pat = "(?ms)^##\s*\[$([regex]::Escape($env:VTPLAY_VERSION))\][^\n]*\n(.*?)(?=^##\s*\[|\z)"
          $m = [regex]::Match($md, $pat)
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() }
                  else { "见仓库 CHANGELOG.md 的 $env:VTPLAY_VERSION 段落。" }
          # 用数组拼接而不是 here-string：@"..."@ 在 YAML 块里的缩进很容易踩坑
          $head = @(
            'Windows 64 位便携版，解压后双击 `vtplay.exe` 即可，无需安装。',
            '',
            '发布包已通过依赖闭包校验；完整验证方式见 `tools/release/verify_package.ps1`。',
            '',
            '---',
            ''
          )
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          (($head + @($body)) -join "`n") | Set-Content -Path dist/release-body.md -Encoding UTF8
          Write-Output '--- release body (前 8 行) ---'
          Get-Content dist/release-body.md -Encoding UTF8 | Select-Object -First 8

      # 临时排查用：失败时把打包日志推到 ci-diagnostics 分支。
      # 起因是「本地过、CI 挂」但拿不到 Actions 日志（下载日志需鉴权，403），
      # 而分支内容可以匿名读取。排查完这段应删除。
      - name: 失败诊断（临时）
        if: failure()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B ci-diagnostics
          $listing = @()
          $listing += "pwsh $($PSVersionTable.PSVersion)  platform=$($PSVersionTable.Platform)"
          $listing += "MINGW_BIN=$env:MINGW_BIN"
          $listing += "bash = $((Get-Command bash -ErrorAction SilentlyContinue).Source)"
          $listing += 'PATH 中与 msys/mingw 相关的项：'
          $listing += ($env:PATH -split ';' | Where-Object { $_ -match 'msys|mingw' } | ForEach-Object { "  $_" })
          foreach ($c in @('C:\msys64', 'D:\msys64', 'C:\tools\msys64')) {
            $listing += "$c 存在=$(Test-Path $c)"
            if (Test-Path $c) {
              $listing += (Get-ChildItem $c -Directory -ErrorAction SilentlyContinue |
                           Select-Object -First 10 | ForEach-Object { "    $($_.Name)" })
              foreach ($sub in 'mingw64\bin', 'ucrt64\bin', 'clang64\bin') {
                $p = Join-Path $c "$sub\windeployqt.exe"
                if (Test-Path $p) { $listing += "    找到: $p" }
              }
            }
          }
          if (Test-Path dist) {
            $listing += (Get-ChildItem dist -Force | ForEach-Object { "  $($_.Name)  $($_.Length)" })
          } else { $listing += '  (dist 不存在)' }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $listing | Out-File -FilePath dist\listing.txt -Encoding UTF8
          $files = @('dist/listing.txt')
          if (Test-Path dist/package.log) { $files += 'dist/package.log' }
          if (Test-Path ci-diag.txt) { $files += 'ci-diag.txt' }
          git add -f $files
          git commit -m 'ci diagnostics (temporary)' --allow-empty
          git push -f origin ci-diagnostics

      # 发布包已在 dist/ 里打好，这里只做「创建 Release + 上传」
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: VTPlay ${{ env.VTPLAY_VERSION }}
          body_path: dist/release-body.md
          files: dist/vtplay-*-win64.zip
          draft: false
          prerelease: false
